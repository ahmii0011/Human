<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Muhtarma Galaxy 🌌✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #030008;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* Cosmic Starfield Canvas background effect via CSS */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.15;
            z-index: 1;
        }
        .galaxy-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .central-core {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-radius: 50%;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            box-shadow: 0 0 40px rgba(255, 65, 108, 0.7);
            animation: pulseCore 3s infinite alternate ease-in-out;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        @keyframes pulseCore {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 65, 108, 0.5); }
            100% { transform: scale(1.08); box-shadow: 0 0 60px rgba(255, 65, 108, 0.9); }
        }
        h1 {
            font-size: 26px;
            background: linear-gradient(to right, #ff99cc, #ffccff, #99ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        /* Orbiting Nodes Grid */
        .orbit-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .planet-node {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .planet-node:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-5px) scale(1.03);
            border-color: rgba(255, 153, 204, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .planet-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .planet-title {
            font-size: 13px;
            font-weight: 600;
            color: #ffd1dc;
        }
        /* Display Modal Box */
        .display-screen {
            background: rgba(15, 10, 25, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
            color: #f1f1f1;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
        }
        /* Floating neon particles */
        .neon-particle {
            position: absolute;
            pointer-events: none;
            animation: floatParticle 3.5s linear infinite;
            z-index: 2;
        }
        @keyframes floatParticle {
            0% { transform: translateY(105vh) scale(0.4); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="galaxy-container">
        <!-- Pulsing Center Core -->
        <div class="central-core" onclick="coreShockwave()">
            👑
        </div>

        <h1>Muhtarma Galaxy</h1>
        <p class="subtitle">TAP ANY PLANET TO EXPLORE THE COSMOS ✨</p>

        <!-- Interactive Orbit Nodes -->
        <div class="orbit-grid">
            <div class="planet-node" onclick="showSecret('note')">
                <div class="planet-icon">💌</div>
                <div class="planet-title">Secret Notes</div>
            </div>
            <div class="planet-node" onclick="showSecret('vibe')">
                <div class="planet-icon">💫</div>
                <div class="planet-title">Vibe Check</div>
            </div>
            <div class="planet-node" onclick="showSecret('task')">
                <div class="planet-icon">☕</div>
                <div class="planet-title">Cute Tasks</div>
            </div>
            <div class="planet-node" onclick="showSecret('praise')">
                <div class="planet-icon">🌸</div>
                <div class="planet-title">Special Crown</div>
            </div>
        </div>

        <!-- Output Screen -->
        <div class="display-screen" id="outputScreen">
            Suno Muhtarma... Upar kisi bhi planet par click karo aur magic dekho! 🌙✨
        </div>
    </div>

    <script>
        const secrets = {
            note: "Suno Muhtarma... Aapki baaton mein aisi ajeeb si khichav aur sukoon hai jo kahin aur nahi milta! ☕🤍",
            vibe: "Vibe Analysis Result: 1000% Supreme Queen Energy & Infinite Aesthetic Glow! 👑✨",
            task: "Cosmic Task: Ek lambi saans lo, saari tension drop karo aur ek pyaari si smile paas karo! 😊🌸",
            praise: "Duniya chahe jaisi bhi ho, aapka yeh cute mood aur smile hamesha on honi chahiye! 🦋💖"
        };

        function showSecret(type) {
            const screen = document.getElementById("outputScreen");
            screen.style.opacity = 0;
            screen.style.transform = "scale(0.95)";
            
            setTimeout(() => {
                screen.innerText = secrets[type];
                screen.style.opacity = 1;
                screen.style.transform = "scale(1)";
            }, 200);

            spawnNeonParticle("✨");
        }

        function coreShockwave() {
            const screen = document.getElementById("outputScreen");
            screen.innerText = "🌟 Muhtarma Core Activated! You are officially the main character of this universe! 🚀👑";
            spawnNeonParticle("💖");
        }

        function spawnNeonParticle(symbol) {
            const p = document.createElement("div");
            p.classList.add("neon-particle");
            p.innerHTML = symbol;
            p.style.left = Math.random() * window.innerWidth + "px";
            p.style.animationDuration = (Math.random() * 2 + 2) + "s";
            p.style.fontSize = (Math.random() * 10 + 16) + "px";
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 3500);
        }

        document.getElementById("outputScreen").style.transition = "all 0.3s ease";
    </script>
</body>
</html>
