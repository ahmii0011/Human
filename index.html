<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suno Muhtarma... 🌙✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #1e051d, #0f0210, #050005);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }
        .poetry-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 105, 180, 0.2);
            width: 100%;
            max-width: 440px;
            border-radius: 35px;
            padding: 35px 25px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 105, 180, 0.1);
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .crown-icon {
            font-size: 42px;
            margin-bottom: 15px;
            animation: floatCrown 3s ease-in-out infinite;
        }
        @keyframes floatCrown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        h1 {
            font-size: 22px;
            letter-spacing: 2px;
            color: #ffb8d9;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .sub-tag {
            font-size: 12px;
            color: #a08095;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .poetry-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 30px 20px;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 25px;
            position: relative;
        }
        #poetryText {
            font-size: 17px;
            line-height: 1.8;
            color: #fce4ec;
            font-style: italic;
            transition: all 0.4s ease;
        }
        .btn-poetry {
            background: linear-gradient(135deg, #ff2a75, #b31458);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 18px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 42, 117, 0.4);
            transition: transform 0.2s, background 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-poetry:active {
            transform: scale(0.97);
        }
        .counter-num {
            margin-top: 15px;
            font-size: 12px;
            color: #7a5c6d;
        }
        /* Floating romantic petals/hearts */
        .petal {
            position: absolute;
            pointer-events: none;
            animation: fallPetal 4s linear infinite;
            z-index: 1;
        }
        @keyframes fallPetal {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.6); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="poetry-card">
        <div class="crown-icon">🌹✨</div>
        <h1>Suno Muhtarma...</h1>
        <div class="sub-tag">DIL KI GEHRAIYON SE KUCH KHAASE ALFAS</div>

        <div class="poetry-box">
            <p id="poetryText">"Aapka yun be-wajah yaad aana, aur phir chehre par ek pyari si muskaanajaa jaana... Maano jaise zindagi mein kisi khoobsurat geet ka aana ho. 🥀✨"</p>
        </div>

        <button class="btn-poetry" onclick="nextPoetry()">Agli Shayari Padho 💌</button>
        <div class="counter-num" id="counter">Ehsas 1 of 5</div>
    </div>

    <script>
        const poeticWishes = [
            "\"Aapka yun be-wajah yaad aana, aur phir chehre par ek pyari si muskaan aa jaana... Maano jaise zindagi mein kisi khoobsurat geet ka aana ho. 🥀✨\"",
            "\"Log kehte hain ke khubsurati chehre mein hoti hai, par unhe kya pata ke sukoon toh aapki baaton aur aapki sadgi mein basta hai. ☕🤍\"",
            "\"Fursat jab bhi milti hai kayanat ko, woh zaroor aapki muskaan banane mein waqt lagati hogi. Aap hasti ho toh lagta hai raunak aur badh gayi hai! 🌙🦋\"",
            "\"Anjaan raahon mein bhi agar aapka zikr ho jaye, toh dil ko ek alag hi apnapan mehsoos hota hai. Aap bas yunhi hamesha muskurati raho! 🌸💫\"",
            "\"Tareeifein toh bohot hain aapke liye, par alfaas kam pad jaate hain. Aap jaisi ho, bas aisi hi bemisaal rehna hamesha! 👑💖\""
        ];

        let index = 0;

        function nextPoetry() {
            index = (index + 1) % poeticWishes.length;
            const textElement = document.getElementById("poetryText");
            
            // Fade out & slide effect
            textElement.style.opacity = 0;
            textElement.style.transform = "translateY(10px)";
            
            setTimeout(() => {
                textElement.innerText = poeticWishes[index];
                textElement.style.opacity = 1;
                textElement.style.transform = "translateY(0)";
                document.getElementById("counter").innerText = `Ehsas ${index + 1} of ${poeticWishes.length}`;
            }, 300);

            spawnPetal();
        }

        function spawnPetal() {
            const p = document.createElement("div");
            p.classList.add("petal");
            p.innerHTML = Math.random() > 0.5 ? "🥀" : "✨";
            p.style.left = Math.random() * window.innerWidth + "px";
            p.style.animationDuration = (Math.random() * 2 + 3) + "s";
            p.style.fontSize = (Math.random() * 10 + 16) + "px";
            document.body.appendChild(p);

            setTimeout(() => {
                p.remove();
            }, 4000);
        }

        document.getElementById("poetryText").style.transition = "all 0.3s ease";
    </script>
</body>
</html>
